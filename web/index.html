<!doctype html>
<base href="/web/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000">
<!-- Installable: standalone, portrait, full-screen on an iOS home screen. The icon is the guest's
     own Windows flag: PROGMAN.EXE RT_ICON 18 (32x32, 16 colours), extracted with tools/ne-icons.py
     and scaled nearest-neighbour; the touch icon sits on desktop grey since iOS drops alpha. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Windows 3.11">
<!-- The boot screen the host paints over the snapshot restore. Preloaded so it is decoding while
     app.js is still being parsed: it is the first thing anyone sees. -->
<link rel="preload" as="image" href="boot-splash.webp">
<link rel="preload" as="image" href="boot-splash-tall.webp">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Responsive Windows for Workgroups 3.11</title>
<style>
  /* Safe areas (notch, home indicator) as tokens the compositor can read: it keeps guest pixels
     out from under them and paints the insets black, which is nothing, not chrome. */
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
          --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); }
  html, body { margin:0; height:100%; background:#000; color:#bbb;
               font:12px/1.4 ui-monospace, monospace; overflow:hidden; overscroll-behavior:none; }
  /* The guest's own canvas is never shown: it is the source the compositor draws slices from. */
  #screen_container { position:absolute; left:-10000px; top:0; }
  /* cursor:none is the phone's setting and the starting point everywhere: the guest draws its own
     pointer there and two pointers a few pixels apart is worse than none. On a desktop app.js
     replaces this with the CSS shape the guest reports (PVC), and the guest's drawn pointer is the
     one that goes away -- the browser's is the real mouse, so it never lags. */
  #pres { position:fixed; inset:0; z-index:1; touch-action:none; display:block; image-rendering: pixelated; cursor:none; }
  /* The LCD filter (?lcd=1) draws the finished composite through a shader on top of it. It never
     takes a touch: #pres stays the input surface underneath, so the geometry, the hit testing and
     the pointer are exactly as they are without it. */
  /* width/height explicitly: a canvas is a replaced element, so `width:auto` between insets
     resolves to its INTRINSIC size (the backing store, device pixels) rather than the space
     between them, and the page shows the top-left corner of it magnified by the pixel ratio. */
  #lcd { position:fixed; inset:0; width:100%; height:100%; z-index:2; display:none; pointer-events:none; }
  #lcd.on { display:block; }
  #screen_container canvas { display:block; touch-action:none;
                             transition: width .18s ease-out, height .18s ease-out; }
  /* The page draws nothing of its own on any display: the desktop is the whole viewport (the old
     development toolbar only exists with ?dev=1, built by app.js). */
  #bar { position:fixed; left:0; right:0; bottom:0; display:flex; gap:10px; align-items:center;
         padding:6px 10px calc(6px + env(safe-area-inset-bottom)); background:rgba(0,0,0,.75);
         z-index:2; font-size:11px; }
  #bar button { font:inherit; padding:4px 8px; }
  /* The hidden input that summons the platform keyboard. It must stay focusable on iOS: on
     screen, non-zero size, visible to layout (opacity, not display/visibility), 16 px so Safari
     does not zoom the page when it takes the focus. */
  #kbd { position:fixed; left:0; top:0; width:2px; height:2px; padding:0; border:0; margin:0; opacity:0.01;
         font-size:16px; pointer-events:none; z-index:0; background:transparent; color:transparent; caret-color:transparent; }
.phone #pres { height: 100dvh; }
/* Keyboard accessory bar: the one piece of host chrome, docked to the top of the soft keyboard
   for the keys iOS does not have (Esc, Tab, arrows, F-keys, Ctrl/Alt). Hidden otherwise. */
#keybar { position:fixed; left:0; right:0; z-index:3; display:none; background:rgba(28,28,30,.96);
  border-top:1px solid #3a3a3c; padding:2px 3px calc(2px + env(safe-area-inset-bottom)); overflow-x:auto; overflow-y:hidden; white-space:nowrap;
  -webkit-overflow-scrolling:touch; scrollbar-width:none; font:14px -apple-system, system-ui, sans-serif; user-select:none; -webkit-user-select:none; touch-action:pan-x;
  gap:2px; align-items:center; }
#keybar::-webkit-scrollbar { display:none; }
#keybartab { position:fixed; right:8px; z-index:3; display:none; height:26px; padding:0 10px; border:0; border-radius:6px 6px 0 0;
  background:rgba(28,28,30,.92); color:#fff; font:12px -apple-system, system-ui, sans-serif; user-select:none; -webkit-user-select:none; }
#keybartab.show { display:block; }
#keybartab.open { background:#0a84ff; }
#keybar.show { display:flex; }
/* Dense: 34 px keys, 2 px gaps, no vertical padding beyond the safe area. Esc Tab arrows Ctrl Alt
   Del come first; the rest is behind the horizontal scroll. The hide key stays pinned at the right. */
#keybar button { flex:0 0 auto; min-width:34px; height:34px; margin:0; padding:0 7px; border:0; border-radius:5px;
  background:#636366; color:#fff; font:inherit; font-weight:600; line-height:34px; }
#keybar button.arrow { min-width:30px; padding:0 4px; }
#keybar button.on { background:#0a84ff; }
#keybar button.lock { background:#0a84ff; box-shadow: inset 0 0 0 2px #fff; }
#keybar button.hide { position:sticky; right:0; margin-left:auto; background:#3a3a3c; box-shadow:-6px 0 6px rgba(28,28,30,.96); }
#keybar button:active { background:#8e8e93; }
#keybar .gap { flex:0 0 6px; }
</style>
<canvas id="pres"></canvas>
<canvas id="lcd"></canvas>
<div id="keybar"></div>
<!-- The bar is folded away by default: this small tab on top of the keyboard opens it. -->
<button id="keybartab" aria-label="extra keys">⌨ keys</button>
<div id="screen_container">
  <div style="white-space:pre; font:14px monospace"></div>
  <canvas style="display:none"></canvas>
</div>
<input id="kbd" type="text" inputmode="text" enterkeyhint="enter" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="keyboard input">
<script type="module" src="app.js"></script>
