<!doctype html>
<base href="/web/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000">
<title>Responsive Windows for Workgroups 3.11</title>
<style>
  html, body { margin:0; height:100%; background:#000; color:#bbb;
               font:12px/1.4 ui-monospace, monospace; overflow:hidden; overscroll-behavior:none; }
  /* The guest's own canvas is never shown: it is the source the compositor draws slices from. */
  #screen_container { position:absolute; left:-10000px; top:0; }
  #pres { position:fixed; inset:0; z-index:1; touch-action:none; display:block; image-rendering: pixelated; }
  #screen_container canvas { display:block; touch-action:none;
                             transition: width .18s ease-out, height .18s ease-out; }
  /* the previous frame, held over the top across a resize so the screen does not flash */
  #bar { position:fixed; left:0; right:0; bottom:0; display:flex; gap:10px; align-items:center;
         padding:6px 10px calc(6px + env(safe-area-inset-bottom)); background:rgba(0,0,0,.75);
         z-index:2; font-size:11px; }
  #bar button { font:inherit; padding:4px 8px; }
  #kbd { position:fixed; left:-1000px; top:0; opacity:0; }
/* On a phone the page shows nothing of its own: no toolbar, the desktop is the whole viewport. */
.phone #bar { display: none; }
.phone #pres { height: 100dvh; }
/* Keyboard accessory bar: the one piece of host chrome, docked to the top of the soft keyboard
   for the keys iOS does not have (Esc, Tab, arrows, F-keys, Ctrl/Alt). Hidden otherwise. */
#keybar { position:fixed; left:0; right:0; z-index:3; display:none; background:rgba(28,28,30,.96);
  border-top:1px solid #3a3a3c; padding:6px 6px calc(6px + env(safe-area-inset-bottom)); overflow-x:auto; white-space:nowrap;
  -webkit-overflow-scrolling:touch; scrollbar-width:none; font:15px -apple-system, system-ui, sans-serif; user-select:none; -webkit-user-select:none; touch-action:pan-x; }
#keybar::-webkit-scrollbar { display:none; }
#keybar.show { display:block; }
#keybar button { display:inline-block; min-width:42px; height:40px; margin:0 3px; padding:0 10px; border:0; border-radius:6px;
  background:#636366; color:#fff; font:inherit; font-weight:600; vertical-align:middle; }
#keybar button.on { background:#0a84ff; }
#keybar button:active { background:#8e8e93; }
#keybar .gap { display:inline-block; width:10px; }
</style>
<canvas id="pres"></canvas>
<div id="keybar"></div>
<div id="screen_container">
  <div style="white-space:pre; font:14px monospace"></div>
  <canvas style="display:none"></canvas>
</div>
<input id="kbd" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
<div id="bar">
  <span id="status">loading</span>
  <span id="mode"></span>
  <span id="zoom"></span>
  <button id="zoomout">&minus;</button>
  <button id="zoomin">+</button>
  <button id="zoomfit">fit</button>
  <button id="kbdbtn">keyboard</button>
  <button id="savebtn">save</button>
  <button id="resetbtn">fresh boot</button>
</div>
<script type="module" src="app.js"></script>
